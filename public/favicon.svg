<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="blipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#0f172a" />
  <!-- Radar circles -->
  <circle cx="50" cy="50" r="36" stroke="#334155" stroke-width="2" fill="none" opacity="0.6" />
  <circle cx="50" cy="50" r="24" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="4 3" opacity="0.8" />
  <!-- Signal Blip -->
  <circle cx="50" cy="50" r="14" fill="url(#blipGrad)" filter="url(#glow)" />
  <circle cx="50" cy="50" r="6" fill="#ffffff" />
  <!-- Radar sweep ping -->
  <circle cx="68" cy="34" r="5" fill="#10b981" />
</svg>
